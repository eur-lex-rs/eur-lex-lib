[package]
name = "eur-lex-lib"
version = "0.1.0"
edition = "2024"
authors = ["Romain VINCENT <romain+eurolexrs@rvincent.eu>"]
description = "A Rust library for parsing EU regulations published in Formex 4 XML format"
readme = "../README.md"
repository = "https://github.com/eur-lex-rs/eur-lex-lib"
license-file = "../LICENSE"

[lib]
name = "eur_lex_lib"
path = "src/lib.rs"

[features]
fmt = []

[dependencies]
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
regex = "1"
thiserror = "2"
