[package]
name = "eur-lex-lib"
version = "0.1.0"
edition = "2024"
author = ["Romain VINCENT <romain+eurolexrs@rvincent.eu>"]
description = "A Rust library and command-line tool for parsing EU regulations published in Formex 4 XML format and converting them to JSON"
readme = "README.md"
repository = "https://github.com/eur-lex-rs/eur-lex-lib"
license-file = "LICENSE"

[lib]
name = "eur_lex_lib"
path = "src/lib.rs"

[[bin]]
name = "eur_lex_loader"
path = "src/main.rs"

[[bin]]
name = "eur_lex_fetch"
path = "src/fetch.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
regex = "1"
thiserror = "2"
zip = "8"
