[package]
name = "eur-lex-utils"
version = "0.1.0"
edition = "2024"
authors = ["Romain VINCENT <romain+eurolexrs@rvincent.eu>"]
description = "CLI tools for loading and fetching EU regulations via EUR-Lex"
repository = "https://github.com/eur-lex-rs/eur-lex-lib"
license-file = "../LICENSE"

[[bin]]
name = "eur_lex_loader"
path = "src/load.rs"

[[bin]]
name = "eur_lex_fetch"
path = "src/fetch.rs"

[dependencies]
eur-lex-lib = { path = "../eur-lex-lib" }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }
serde_json = "1"
tempfile = "3"
zip = "8"
